services:
  crm:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      PORT: 3100
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /app/data
      CRM_ADMIN_EMAIL: ${CRM_ADMIN_EMAIL:-admin@local.crm}
      CRM_ADMIN_PASSWORD: ${CRM_ADMIN_PASSWORD:?请在 .env 配置强密码}
      COOKIE_SECURE: ${COOKIE_SECURE:-0}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3100}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - crm_data:/app/data
    security_opt:
      - no-new-privileges:true
volumes:
  crm_data:
